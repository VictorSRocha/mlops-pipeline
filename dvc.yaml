# =============================================================================
# dvc.yaml — Pipeline de coleta versionada com DVC
# =============================================================================
# O que é este arquivo?
# ---------------------
# dvc.yaml define a pipeline como código: cada "stage" (estágio) descreve
# um passo da pipeline com seu comando, dependências e saídas.
#
# Benefícios:
# 1. Reprodutibilidade: qualquer pessoa com o repositório pode reproduzir
#    os mesmos dados rodando "dvc repro"
# 2. Cache inteligente: DVC só reexecuta um estágio se suas deps mudaram
#    (igual ao Make, mas para pipelines de dados)
# 3. Rastreabilidade: cada versão do código aponta para uma versão dos dados
#
# Comandos úteis:
#   dvc repro              → executa apenas estágios com deps modificadas
#   dvc repro --force      → força reexecução de todos os estágios
#   dvc status             → mostra quais estágios estão desatualizados
#   dvc dag                → exibe o grafo de dependências (DAG) da pipeline
#
# O que é um DAG?
# DAG = Directed Acyclic Graph (Grafo Acíclico Dirigido).
# É uma representação visual das dependências entre estágios:
# coleta → processamento → features → treino → avaliação
# Cada seta indica "este estágio depende do anterior".
# =============================================================================

stages:

  # ---------------------------------------------------------------------------
  # Estágio 0: Geração do banco SQLite (só para desenvolvimento)
  # ---------------------------------------------------------------------------
  # Este estágio só existe para facilitar o desenvolvimento local.
  # Em produção, este estágio não existiria — os dados vêm de fontes reais.
  #
  # Separação de responsabilidades (Ep 01):
  #   generate_mock (aqui): cria data/raw/local.db — demonstrado na Parte 2
  #   demographics.csv + support_tickets.csv: gerados inline no notebook
  #   da Parte 3 e commitados diretamente no git (não rastreados pelo DVC).
  generate_mock:
    cmd: python scripts/generate_mock_data.py
    # cmd: o comando executado pelo shell quando este estágio rodar.

    deps:
      - scripts/generate_mock_data.py
      # deps: arquivos que, se modificados, fazem este estágio reexecutar.
      # Inclua CÓDIGO e DADOS de entrada.

    outs:
      - data/raw/local.db:
          cache: true
          # cache: true → DVC versiona este arquivo no .dvc/cache
          # O arquivo real fica fora do Git (listado no .gitignore gerado pelo DVC)
          # Um arquivo .dvc é commitado no Git como "ponteiro"

  # ---------------------------------------------------------------------------
  # Estágio 1: Coleta de dados (principal deste episódio)
  # ---------------------------------------------------------------------------
  collect:
    cmd: python -m src.data.pipeline
    # "python -m src.data.pipeline" executa o módulo como script.
    # O "-m" faz o Python procurar o módulo no PYTHONPATH (não num arquivo direto),
    # garantindo que imports relativos (from .collect_api import ...) funcionem.

    deps:
      # Código-fonte: se qualquer arquivo mudar, o estágio reexecuta
      - src/data/__init__.py
      - src/data/collect_api.py
      - src/data/collect_db.py
      - src/data/collect_files.py
      - src/data/pipeline.py
      # Dados de entrada: o banco gerado pelo estágio anterior
      - data/raw/local.db
      - data/mock/demographics.csv
      - data/mock/support_tickets.csv

    outs:
      # Saídas rastreadas pelo DVC
      - data/raw/customers_api.parquet:
          cache: true
      - data/raw/transactions_db.parquet:
          cache: true
      - data/raw/external_merged.parquet:
          cache: true

    # O watermark é versionado pelo Git (não pelo DVC) por ser pequeno
    # e conter informação de estado importante. Não listamos em outs.

# =============================================================================
# Configuração de parâmetros (opcional, mas boa prática)
# =============================================================================
# Se você quiser rastrear parâmetros usados na pipeline:
# params:
#   - params.yaml:
#     - collect.page_size
#     - collect.chunk_size
#
# Crie um arquivo params.yaml:
# collect:
#   page_size: 500
#   chunk_size: 10000
#
# E leia no código:
# import yaml
# params = yaml.safe_load(open("params.yaml"))
# page_size = params["collect"]["page_size"]
